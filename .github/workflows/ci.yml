name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Brak package.json (przed T-001) — pomijam
        if: hashFiles('package.json') == ''
        run: echo "::notice::package.json nie istnieje — CI pominięte do czasu bootstrapu (T-001)."
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci
      - name: Verify (typecheck, lint, format, arch, test+coverage, knip, build, publint/attw, e2e)
        if: hashFiles('package.json') != ''
        run: npm run verify
        env:
          CI: 'true'
      - name: Upload coverage
        if: hashFiles('package.json') != '' && matrix.node == 22 && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: 'Opis: mała litera na początku, bez kropki na końcu (Conventional Commits).'

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 22
      - name: npm audit (runtime deps)
        if: hashFiles('package-lock.json') != ''
        run: npm audit --omit=dev --audit-level=high

  bench:
    name: bench
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('scripts/bench-hook.mjs') != ''
        with:
          node-version: 22
          cache: npm
      - name: Bench (raport; twarda granica tylko dla B1–B3 +20%, patrz docs/09)
        if: hashFiles('scripts/bench-hook.mjs') != ''
        run: |
          npm ci
          npm run build
          npm run bench:hook -- --ci --report bench-report.md
      - name: Dodaj raport do podsumowania joba
        if: hashFiles('bench-report.md') != ''
        run: cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
